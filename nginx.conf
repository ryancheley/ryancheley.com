server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    access_log /var/log/nginx/ryancheley.com/access.log;
    error_log  /var/log/nginx/ryancheley.com/error.log;

    # Enable directory listing for drafts folder
    location /drafts/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # MTA-STS policy for mta-sts.ryancheley.com (TXT record lives in ryancheley/infra)
    # testing, not enforce: Hover's MX cert is *.hostedemail.com, which can't match mx.hover.com.cust.hostedemail.com
    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        return 200 "version: STSv1\nmode: testing\nmx: mx.hover.com.cust.hostedemail.com\nmax_age: 604800\n";
    }

    # Default location
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Custom 404 page if it exists
    error_page 404 /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
    }
}
